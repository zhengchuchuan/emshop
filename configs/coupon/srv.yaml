# 优惠券服务配置文件
# 服务器配置
server:
  name: emshop-coupon-srv
  host: 0.0.0.0   # 显式注册可直连地址，避免 0.0.0.0 被解析为不可达网卡IP
  port: 28056          # 固定 gRPC 端口，避免随机端口导致无法直连
  http-port: 8056
  healthz: true
  enable-metrics: true
  profiling: true

# 日志配置  
log:
  name: emshop-coupon-srv
  development: true
  level: debug
  format: json
  enable-color: false
  disable-caller: false
  disable-stacktrace: false
  output-paths: logs/emshop-coupon-srv.log,stdout
  error-output-paths: logs/emshop-coupon-srv.error.log

# 服务注册与发现
registry:
  address: localhost:8500
  scheme: http

# 链路追踪配置
telemetry:
  name: coupon
  endpoint: http://localhost:14268/api/traces
  sampler: 1.0
  batcher: jaeger

# MySQL配置
mysql:
  host: "localhost"
  port: 3306
  password: "123456"
  username: "root"
  database: "emshop_coupon_srv"
  max_idle_connections: 10
  max_open_connections: 100
  max_connection_life_time: "1h"
  log_level: 4

# Redis配置
redis:
  host: "127.0.0.1"
  port: 16379
  password: ""
  database: 0

# RocketMQ配置
rocketmq:
  nameservers: ["127.0.0.1:19876"]
  producer_group: "coupon-producer-group"
  consumer_group: "coupon-consumer-group"
  topic: "coupon-events"
  max_reconsume: 3

# DTM配置
dtm:
  grpc_server: "localhost:36790"
  http_server: "localhost:36789"
  timeout: "30s"

# Ristretto本地缓存配置
ristretto:
  num_counters: 1000000           # 1M个key的统计信息
  max_cost: 104857600             # 100MB最大内存
  buffer_items: 64                # 缓冲区大小
  metrics: true                   # 开启监控指标
  
# Canal缓存一致性配置  
  canal:
    consumer_group: "coupon-cache-sync-consumer"  # Canal消费者组
    topic: "coupon-binlog-topic"                  # Canal消息主题
    watch_tables:                                 # 监听的表
      - "coupon_templates"
      - "user_coupons" 
      - "flash_sale_activities"
      - "coupon_configs"
    batch_size: 32                               # 批量处理大小
  
# 业务配置
business:
  # 秒杀配置
  flashsale:
    enable_async: true          # 是否启用异步秒杀链路
    max_qps_per_user: 5           # 单用户最大QPS
    stock_cache_ttl: "300s"       # 库存缓存TTL
    user_limit_ttl: "300s"        # 用户限制TTL（防重复下单5分钟）
    batch_size: 100               # 批量处理大小
    reconcile_interval: "30s"     # 对账周期
    reconcile_threshold: 0         # 差异大于该阈值才触发补偿
    compensation_max_per_run: 100  # 单次最多补偿条数
    compensation_cooldown: "60s"   # 每活动补偿冷却时间
    skip_user_limit_for_test: false # 测试时跳过用户限购（同一用户可多次成功）
    
  # 优惠券配置
  coupon:
    max_stack_count: 5            # 最大叠加数量
    lock_ttl: "900s"              # 锁定TTL（15分钟）
    calc_timeout: "5s"            # 计算超时时间
    
  # 缓存配置
  cache:
    l1_ttl: "10m"                 # L1缓存TTL
    l2_ttl: "30m"                 # L2缓存TTL  
    warmup_count: 100             # 预热优惠券数量
    enable_warmup: false          # 是否开启预热 - 暂时禁用
